version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: k24_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: k24
    ports:
      - "5433:5432"
    volumes:
      - postgres_k24_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d k24"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - k24_network

  # 2. Go Backend Microservice API (Host Port 9001 -> Container Port 8087)
  backend:
    build:
      context: ./backend_k24apps
      dockerfile: Dockerfile
    image: k24_backend_image:latest
    container_name: k24_backend
    restart: always
    ports:
      - "9001:8087"
    environment:
      PORT: 8087
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: admin123
      DB_NAME: k24
      JWT_SECRET: super_secret_jwt_k24_key_2026
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - k24_network

  # 3. Next.js Web Dashboard Application (Host Port 9002 -> Container Port 3000)
  frontend:
    build:
      context: ./web_k24/k24-nextjs
      dockerfile: Dockerfile
    image: k24_frontend_image:latest
    container_name: k24_frontend
    restart: always
    ports:
      - "9002:3000"
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8087
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      - backend
    networks:
      - k24_network

networks:
  k24_network:
    driver: bridge

volumes:
  postgres_k24_data:
    driver: local
